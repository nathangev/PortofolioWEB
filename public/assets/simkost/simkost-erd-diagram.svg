<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#FAF9F6" />
  <rect x="15" y="15" width="890" height="510" stroke="#1E2320" stroke-width="1.5" fill="none" />

  <!-- Header Annotation -->
  <line x1="15" y1="48" x2="905" y2="48" stroke="#1E2320" stroke-width="1" />
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1E2320">ERD 04.RELATIONAL // SIMKOST DATABASE SCHEMA (11 TABLES, 3NF NORMALIZATION)</text>
  <text x="735" y="35" font-family="Arial, sans-serif" font-size="10" fill="#1E2320">COURSE: FINPRO LAB DATABASE</text>

  <!-- TABLE 1: ROOMS -->
  <g transform="translate(35, 65)">
    <rect width="180" height="130" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="180" height="22" fill="#C98A2E" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">TABLE: rooms</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  room_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  category_id (INT)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    room_number (VARCHAR)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    floor_level (INT)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    occupancy_status (ENUM)</text>
    <text x="8" y="118" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    electric_meter_id (FK)</text>
  </g>

  <!-- TABLE 2: ROOM CATEGORIES -->
  <g transform="translate(35, 215)">
    <rect width="180" height="110" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="180" height="22" fill="#1E2320" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAF9F6">TABLE: room_categories</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  category_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    category_name (VARCHAR)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    dimensions (VARCHAR)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    has_ac, has_bath (BOOL)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  tier_id (INT)</text>
  </g>

  <!-- TABLE 3: PRICING TIERS -->
  <g transform="translate(35, 345)">
    <rect width="180" height="90" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="180" height="22" fill="#1E2320" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAF9F6">TABLE: pricing_tiers</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  tier_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    monthly_base_rate (DEC)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    deposit_threshold (DEC)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    effective_from (DATE)</text>
  </g>

  <!-- TABLE 4: TENANTS -->
  <g transform="translate(255, 65)">
    <rect width="190" height="145" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="190" height="22" fill="#C98A2E" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">TABLE: tenants</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  tenant_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    full_name (VARCHAR)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    national_nik (CHAR:16)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    contact_phone (VARCHAR)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    emergency_contact (JSON)</text>
    <text x="8" y="118" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    university_affil (VARCHAR)</text>
    <text x="8" y="134" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    status_active (BOOL)</text>
  </g>

  <!-- TABLE 5: LEASE CONTRACTS -->
  <g transform="translate(255, 230)">
    <rect width="190" height="145" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="190" height="22" fill="#C98A2E" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">TABLE: lease_contracts</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  contract_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  tenant_id (INT)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  room_id (INT)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    start_date (DATE)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    end_date (DATE)</text>
    <text x="8" y="118" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    monthly_rent (DECIMAL)</text>
    <text x="8" y="134" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    deposit_held (DECIMAL)</text>
  </g>

  <!-- TABLE 6: UTILITY METERS & READINGS -->
  <g transform="translate(255, 395)">
    <rect width="190" height="85" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="190" height="22" fill="#1E2320" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAF9F6">TABLE: meter_readings</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  reading_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  room_id, contract_id</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    kwh_previous, kwh_current</text>
  </g>

  <!-- TABLE 7: MONTHLY INVOICES -->
  <g transform="translate(485, 65)">
    <rect width="190" height="145" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="190" height="22" fill="#C98A2E" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">TABLE: invoices</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  invoice_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  contract_id (INT)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    billing_period (CHAR:7)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    base_rent_amount (DEC)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    utility_surcharge (DEC)</text>
    <text x="8" y="118" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    due_date (DATE)</text>
    <text x="8" y="134" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    payment_status (ENUM)</text>
  </g>

  <!-- TABLE 8: PAYMENTS -->
  <g transform="translate(485, 230)">
    <rect width="190" height="110" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="190" height="22" fill="#1E2320" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAF9F6">TABLE: payments</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  payment_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  invoice_id (INT)</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    paid_amount (DECIMAL)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    payment_gateway (ENUM)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    verified_at (TIMESTAMP)</text>
  </g>

  <!-- TABLE 9: MAINTENANCE REQUESTS -->
  <g transform="translate(485, 360)">
    <rect width="190" height="120" fill="#FFFFFF" stroke="#1E2320" stroke-width="1" />
    <rect width="190" height="22" fill="#1E2320" />
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAF9F6">TABLE: maintenance_logs</text>
    <text x="8" y="38" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#B0741F">PK  ticket_id (INT)</text>
    <text x="8" y="54" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#3F6B54">FK  room_id, tenant_id</text>
    <text x="8" y="70" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    issue_category (ENUM)</text>
    <text x="8" y="86" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    description (TEXT)</text>
    <text x="8" y="102" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1E2320">    resolution_status (ENUM)</text>
  </g>

  <!-- RIGHT PANEL: ENGINEERING NOTES & FIGMA INTEGRATION -->
  <g transform="translate(700, 65)">
    <rect width="185" height="415" fill="#EFECE6" stroke="#1E2320" stroke-width="1.2" />
    <rect width="185" height="26" fill="#1E2320" />
    <text x="10" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAF9F6">DATA INTEGRITY SPECS</text>

    <text x="12" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#B0741F">NORMALIZATION:</text>
    <text x="12" y="68" font-family="Georgia, serif" font-size="10" fill="#1E2320">Decomposed all composite</text>
    <text x="12" y="82" font-family="Georgia, serif" font-size="10" fill="#1E2320">and transitive attributes</text>
    <text x="12" y="96" font-family="Georgia, serif" font-size="10" fill="#1E2320">to guarantee 3NF.</text>

    <line x1="12" y1="112" x2="173" y2="112" stroke="#1E2320" stroke-width="0.5" />

    <text x="12" y="132" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#B0741F">IMMUTABLE BILLING:</text>
    <text x="12" y="150" font-family="Georgia, serif" font-size="10" fill="#1E2320">Invoices lock tariff amounts</text>
    <text x="12" y="164" font-family="Georgia, serif" font-size="10" fill="#1E2320">at generation date, preventing</text>
    <text x="12" y="178" font-family="Georgia, serif" font-size="10" fill="#1E2320">historical retroactive price</text>
    <text x="12" y="192" font-family="Georgia, serif" font-size="10" fill="#1E2320">corruption.</text>

    <line x1="12" y1="210" x2="173" y2="210" stroke="#1E2320" stroke-width="0.5" />

    <text x="12" y="230" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#B0741F">HONEST SCOPE:</text>
    <text x="12" y="248" font-family="Georgia, serif" font-size="10" fill="#1E2320">This is a structural</text>
    <text x="12" y="262" font-family="Georgia, serif" font-size="10" fill="#1E2320">modeling and UI design</text>
    <text x="12" y="276" font-family="Georgia, serif" font-size="10" fill="#1E2320">case study for FINPRO,</text>
    <text x="12" y="290" font-family="Georgia, serif" font-size="10" fill="#1E2320">not a deployed app.</text>

    <!-- Figma Direct Button in SVG -->
    <rect x="12" y="325" width="160" height="38" fill="#1E2320" />
    <text x="22" y="348" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E6E1D2">FIGMA FILE LINKED ↗</text>
  </g>
</svg>
